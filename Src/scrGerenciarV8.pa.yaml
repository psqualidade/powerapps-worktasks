                        - lbModalConfirmarV8:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =RGBA(255,255,255,1)
                              Fill: =RGBA(175,54,63,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              OnSelect: |-
                                =If(
                                    varGerenciando = true || IsBlank(varAtividadeExclusaoID),
                                    Notify("Nenhuma atividade selecionada para exclusão.", NotificationType.Warning),
                                    Set(varGerenciando, true);
                                    ClearCollect(colGerErros, {Mensagem: ""});
                                    Clear(colGerErros);
                                    Set(varErroExclusao, Blank());
                                    IfError(
                                        Refresh(tbTarefas);
                                        ClearCollect(
                                            colGerTarefasExcluir,
                                            Filter(tbTarefas, AtividadeID = varAtividadeExclusaoID)
                                        );
                                        Blank(),
                                        Set(varErroExclusao, FirstError.Message);
                                        Blank()
                                    );
                                    If(
                                        IsBlank(varErroExclusao),
                                        ForAll(
                                            colGerTarefasExcluir As tarefa,
                                            IfError(
                                                Remove(tbTarefas, LookUp(tbTarefas, TaskID = tarefa.TaskID)),
                                                Collect(colGerErros, {Mensagem: FirstError.Message});
                                                Blank()
                                            )
                                        );
                                        IfError(
                                            Refresh(tbTarefas);
                                            ClearCollect(
                                                colGerTarefasExcluir,
                                                Filter(tbTarefas, AtividadeID = varAtividadeExclusaoID)
                                            );
                                            Blank(),
                                            Set(varErroExclusao, FirstError.Message);
                                            Blank()
                                        )
                                    );
                                    If(
                                        CountRows(colGerErros) > 0 || !IsBlank(varErroExclusao) || CountRows(colGerTarefasExcluir) > 0,
                                        Notify(
                                            "Não foi possível excluir todas as tarefas. A atividade foi preservada. " &
                                            If(CountRows(colGerErros) > 0, First(colGerErros).Mensagem, Coalesce(varErroExclusao, "Ainda existem tarefas vinculadas.")),
                                            NotificationType.Error
                                        ),
                                        IfError(
                                            Remove(
                                                tbAtividades,
                                                LookUp(tbAtividades, AtividadeID = varAtividadeExclusaoID)
                                            ),
                                            Set(varErroExclusao, FirstError.Message)
                                        );
                                        If(IsBlank(varErroExclusao),
                                            IfError(
                                                Refresh(tbAtividades);
                                                Refresh(tbTarefas),
                                                Set(varErroExclusao, FirstError.Message)
                                            )
                                        );
                                        If(
                                            IsBlank(varErroExclusao) &&
                                            IsBlank(LookUp(tbAtividades, AtividadeID = varAtividadeExclusaoID)) &&
                                            IsBlank(LookUp(tbTarefas, AtividadeID = varAtividadeExclusaoID)),
                                            Set(varErroLog, Blank());
                                            IfError(
                                                Patch(
                                                    tbLogAtividades,
                                                    Defaults(tbLogAtividades),
                                                    {
                                                        LogID: Text(GUID()),
                                                        AtividadeID: varAtividadeExclusaoID,
                                                        RegistroID: varAtividadeExclusaoID,
                                                        Entidade: "Atividade",
                                                        Operacao: "Excluir",
                                                        Usuario: User().FullName,
                                                        EmailUsuario: User().Email,
                                                        DataHora: Now(),
                                                        Detalhes: "Atividade excluída: " & varEditandoAtividade.Titulo,
                                                        Resultado: "Sucesso"
                                                    }
                                                ),
                                                Set(varErroLog, FirstError.Message)
                                            );
                                            ClearCollect(colGerAtividades, tbAtividades);
                                            Clear(colGerTarefasPainel);
                                            Clear(colGerTarefasExcluir);
                                            Set(varEditandoAtividade, Blank());
                                            Set(varConfirmarExclusao, false);
                                            Set(varGerTarefasAberto, false);
                                            Set(varV9EditorAberto, false);
                                            Set(varAtividadeExclusaoID, Blank());
                                            If(
                                                IsBlank(varErroLog),
                                                Notify("Atividade e " & varQtdTarefasExcluir & " tarefa(s) excluída(s) com sucesso.", NotificationType.Success),
                                                Notify("Exclusão confirmada; falha ao registrar auditoria: " & varErroLog, NotificationType.Warning)
                                            ),
                                            Notify(
                                                "Não foi possível confirmar a exclusão de todos os registros. " &
                                                Coalesce(varErroExclusao, "Consulte os arquivos Excel antes de repetir a operação."),
                                                NotificationType.Error
                                            )
                                        )
                                    );
                                    Set(varGerenciando, false)
                                )
                              Size: =11
                              Text: ="Excluir definitivamente"
                              Width: =258
                              X: =268
                              Y: =173
