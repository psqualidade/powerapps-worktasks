                  - lbGerSalvarV7V8:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        Color: =RGBA(255,255,255,1)
                        DisplayMode: =If(varGerenciando || IsBlank(varEditandoAtividade), DisplayMode.Disabled, DisplayMode.Edit)
                        Fill: =RGBA(34,193,238,1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =44
                        OnSelect: |-
                          =If(
                              varGerenciando = true || IsBlank(varEditandoAtividade.AtividadeID),
                              Notify("Selecione uma atividade antes de editar.", NotificationType.Warning),
                              If(
                                  IsBlank(Trim(txtGerTituloV7V8.Text)) || IsBlank(Trim(txtGerDescricaoV7V8.Text)),
                                  Notify("Preencha título e descrição.", NotificationType.Warning),
                                  Set(varGerenciando, true);
                                  Set(varErroEdicao, Blank());
                                  IfError(
                                      Set(
                                          varGerAtualizada,
                                          Patch(
                                              tbAtividades,
                                              LookUp(tbAtividades, AtividadeID = varEditandoAtividade.AtividadeID),
                                              {
                                                  Titulo: Trim(txtGerTituloV7V8.Text),
                                                  Descricao: Trim(txtGerDescricaoV7V8.Text),
                                                  Status: ddlGerStatusV7V8.Selected.Value,
                                                  Complexidade: ddlGerComplexV7V8.Selected.Value,
                                                  Priority: ddlGerPrioridadeV7V8.Selected.Value,
                                                  Assigned: If(IsBlank(cmbGerPessoaV7V8.Selected.DisplayName), varEditandoAtividade.Assigned, cmbGerPessoaV7V8.Selected.DisplayName),
                                                  EstimatedHoras: Sum(colGerTarefasPainel, Coalesce(EstimatedHoras, 0)),
                                                  VinculoID: ddV9VinculoGerenciar.Selected.ID,
                                                  DueDate: dtpGerVencimentoV7V8.SelectedDate,
                                                  AtualizadoEm: Now()
                                              }
                                          )
                                      ),
                                      Set(varErroEdicao, FirstError.Message)
                                  );
                                  If(
                                      IsBlank(varErroEdicao),
                                      Set(varEditandoAtividade, varGerAtualizada);
                                      Refresh(tbAtividades);
                                      ClearCollect(colGerAtividades, tbAtividades);
                                      Set(varErroLog, Blank());
                                      IfError(
                                          Patch(tbLogAtividades, Defaults(tbLogAtividades),
                                              {
                                                  LogID: Text(GUID()),
                                                  AtividadeID: varEditandoAtividade.AtividadeID,
                                                  RegistroID: varEditandoAtividade.AtividadeID,
                                                  Entidade: "Atividade",
                                                  Operacao: "Editar",
                                                  Usuario: User().FullName,
                                                  EmailUsuario: User().Email,
                                                  DataHora: Now(),
                                                  Detalhes: "Atividade atualizada: " & Trim(txtGerTituloV7V8.Text),
                                                  Resultado: "Sucesso"
                                              }
                                          ),
                                          Set(varErroLog, FirstError.Message)
                                      );
                                      If(!IsBlank(varErroLog), Notify("Edição salva, mas o log falhou: " & varErroLog, NotificationType.Warning));
                                      Notify("Alterações gravadas com sucesso.", NotificationType.Success),
                                      Notify("Erro ao atualizar: " & varErroEdicao, NotificationType.Error)
                                  );
                                  Set(varGerenciando, false)
                              )
                          )
                          ;Set(varV9EditorAberto,false)
                        Size: =11
                        Text: ="Salvar alterações"
                        Width: =Min(240, (Parent.Width - 58) * 0.54)
                        X: =20
                        Y: =Parent.Height - 65
