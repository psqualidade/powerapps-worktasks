                              Color: =RGBA(255,255,255,1)
                              DisplayMode: =If(varGerTarefaOperando, DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(34,193,238,1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =36
                              OnSelect: |-
                                =If(
                                    varGerTarefaOperando = true,
                                    Notify("Aguarde a conclusão da gravação atual.", NotificationType.Warning),
                                    If(
                                        IsBlank(varEditandoAtividade.AtividadeID),
                                        Notify("Selecione uma atividade antes de incluir tarefas.", NotificationType.Warning),
                                        If(
                                            IsBlank(Trim(txtGerTarefaTituloV8N.Text)),
                                            Notify("Informe o título da tarefa.", NotificationType.Warning),
                                            If(
                                                IsBlank(dtpGerTarefaPrazoV8N.SelectedDate),
                                                Notify("Informe o vencimento da tarefa.", NotificationType.Warning),
                                                Set(varGerTarefaOperando, true);
                                                Set(varGerTarefaErro, Blank());
                                                Set(varGerTarefaRegistroSalvo, Blank());
                                                If(
                                                    IsBlank(varGerTarefaNovaID),
                                                    Set(
                                                        varGerTarefaNovaID,
                                                        If(!IsBlank(varV9EditandoTarefa), varV9EditandoTarefa.TaskID, Text(GUID()))
                                                    )
                                                );
                                                IfError(
                                                    Set(
                                                        varGerTarefaRegistroSalvo,
                                                        Patch(
                                                            tbTarefas,
                                                            Coalesce(
                                                                LookUp(tbTarefas, TaskID = varGerTarefaNovaID),
                                                                Defaults(tbTarefas)
                                                            ),
                                                            {
                                                                TaskID: varGerTarefaNovaID,
                                                                AtividadeID: varEditandoAtividade.AtividadeID,
                                                                TituloTarefa: Trim(txtGerTarefaTituloV8N.Text),
                                                                Status: ddlGerTarefaStatusV8N.Selected.Value,
                                                                EstimatedHoras: If(
                                                                    IsBlank(Trim(txtGerTarefaHorasV8N.Text)),
                                                                    Blank(),
                                                                    Value(txtGerTarefaHorasV8N.Text)
                                                                ),
                                                                DueDate: dtpGerTarefaPrazoV8N.SelectedDate,
                                                                Priority: ddlGerTarefaPrioridadeV8N.Selected.Value,
                                                                Assigned: If(
                                                                    !IsBlank(cmbV9ResponsavelTarefa.Selected.DisplayName),
                                                                    cmbV9ResponsavelTarefa.Selected.DisplayName,
                                                                    If(
                                                                        !IsBlank(varV9EditandoTarefa),
                                                                        varV9EditandoTarefa.Assigned,
                                                                        If(!IsBlank(varV9ReplicandoTarefa), "", Coalesce(varEditandoAtividade.Assigned, ""))
                                                                    )
                                                                ),
                                                                CriadoEm: If(!IsBlank(varV9EditandoTarefa), varV9EditandoTarefa.CriadoEm, Now()),
                                                                AtualizadoEm: Now()
                                                            }
                                                        )
                                                    ),
                                                    Set(varGerTarefaErro, FirstError.Message)
                                                );
                                                If(
                                                    IsBlank(varGerTarefaErro) && !IsBlank(varGerTarefaRegistroSalvo.TaskID),
                                                    RemoveIf(colGerTarefasPainel, TaskID = varGerTarefaNovaID);
                                                    Collect(colGerTarefasPainel, varGerTarefaRegistroSalvo);
                                                    Set(varGerTarefaErroLog, Blank());
                                                    IfError(
                                                        Patch(
                                                            tbLogAtividades,
                                                            Defaults(tbLogAtividades),
                                                            {
                                                                LogID: Text(GUID()),
                                                                AtividadeID: varEditandoAtividade.AtividadeID,
                                                                RegistroID: varGerTarefaNovaID,
                                                                Entidade: "Tarefa",
                                                                Operacao: "Incluir",
                                                                Usuario: User().FullName,
                                                                EmailUsuario: User().Email,
                                                                DataHora: Now(),
                                                                Detalhes: "Tarefa incluída: " & Trim(txtGerTarefaTituloV8N.Text),
                                                                Resultado: "Sucesso"
                                                            }
                                                        ),
                                                        Set(varGerTarefaErroLog, FirstError.Message)
                                                    );
                                                    IfError(
                                                        Refresh(tbTarefas),
                                                        Notify("Tarefa salva; atualização da conexão pendente.", NotificationType.Warning)
                                                    );
                                                    IfError(
                                                        Set(
                                                            varV9AtividadeHoras,
                                                            Patch(
                                                                tbAtividades,
                                                                LookUp(tbAtividades, AtividadeID = varEditandoAtividade.AtividadeID),
                                                                {
                                                                    EstimatedHoras: Sum(colGerTarefasPainel, Coalesce(EstimatedHoras, 0)),
                                                                    AtualizadoEm: Now()
                                                                }
                                                            )
                                                        );
                                                        Set(varEditandoAtividade, varV9AtividadeHoras);
                                                        UpdateIf(
                                                            colGerAtividades,
                                                            AtividadeID = varV9AtividadeHoras.AtividadeID,
                                                            {EstimatedHoras: varV9AtividadeHoras.EstimatedHoras}
                                                        ),
                                                        Notify("Tarefa salva, mas não foi possível sincronizar as horas da atividade.", NotificationType.Warning)
                                                    );
                                                    Set(varV9EditandoTarefa, Blank());
                                                    Set(varV9ReplicandoTarefa, Blank());
                                                    Reset(cmbV9ResponsavelTarefa);
                                                    Reset(txtGerTarefaTituloV8N);
                                                    Reset(txtGerTarefaHorasV8N);
                                                    Reset(ddlGerTarefaStatusV8N);
                                                    Reset(ddlGerTarefaPrioridadeV8N);
                                                    Reset(dtpGerTarefaPrazoV8N);
                                                    Set(varGerTarefaNovaID, Blank());
                                                    If(
                                                        IsBlank(varGerTarefaErroLog),
                                                        Notify("Tarefa salva com sucesso e disponível na lista.", NotificationType.Success),
                                                        Notify("Tarefa salva; falha na auditoria: " & varGerTarefaErroLog, NotificationType.Warning)
                                                    ),
                                                    Notify(
                                                        "Não foi possível salvar a tarefa: " & Coalesce(varGerTarefaErro, "A conexão não confirmou o registro."),
                                                        NotificationType.Error
                                                    )
                                                );
                                                Set(varGerTarefaOperando, false)
                                            )
                                        )
                                    )
                                )
                              Size: =12
