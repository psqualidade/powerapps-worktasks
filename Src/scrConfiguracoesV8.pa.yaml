        If(
            IsBlank(varErroAuditoria),
            ClearCollect(colAuditoriaV8, tbLogAtividades),
            Clear(colAuditoriaV8);
            Notify("Não foi possível consultar a auditoria: " & varErroAuditoria, NotificationType.Error)
