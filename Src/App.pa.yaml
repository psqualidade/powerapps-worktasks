App:
  Properties:
    OnStart: |-
      =ClearCollect(
          colComplexidade,
          {Value: "Baixa"},
          {Value: "Média"},
          {Value: "Alta"}
      );
      ClearCollect(
          colPrioridade,
          {Value: "Baixa"},
          {Value: "Média"},
          {Value: "Alta"},
          {Value: "Crítica"}
      );
      ClearCollect(
          colStatus,
          {Value: "Backlog"},
          {Value: "In Progress"},
          {Value: "Done"}
      );
      ClearCollect(
          colTarefasTemp,
          {
              TaskID: Blank(),
              Tarefa: "",
              Status: "",
              EstimatedHoras: Blank(),
              DueDate: Blank(),
              Priority: ""
          }
      );
      Clear(colTarefasTemp);
      ClearCollect(
          colAtividadesTemp,
          {
              AtividadeID: Blank(),
              Titulo: "",
              Descricao: "",
              Status: "",
              Complexidade: "",
              Assigned: "",
              EstimatedHoras: Blank(),
              DueDate: Blank(),
              Priority: "",
              CriadoEm: Blank(),
              QtdTarefas: 0
          }
      );
      Clear(colAtividadesTemp);
    StartScreen: =scrInicioV8
    Theme: =PowerAppsTheme
