                        - cntBotoesV3Reg7V8:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =52
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =52
                              PaddingBottom: =8
                              PaddingTop: =8
                              Width: =Parent.Width - 32
                            Children:
                              - lbSalvarV3Reg7V8:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    Color: =RGBA(255,255,255,1)
                                    DisplayMode: =If(varSalvando = true, DisplayMode.Disabled, DisplayMode.Edit)
                                    Fill: =RGBA(34,193,238,1)
                                    FillPortions: =3
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =36
                                    OnSelect: |
                                      =If(
                                          varSalvando <> true,
                                          If(
                                              IsBlank(Trim(txtTituloReg7V8.Text)) || IsBlank(Trim(txtDescricaoReg7V8.Text)),
                                              Notify("Preencha o título e a descrição.", NotificationType.Warning),
                                              If(
                                                  varExibirEntradaTarefa = true && !IsBlank(Trim(txtTarefaTituloReg7V8.Text)),
                                                  Notify("Clique em Adicionar para incluir a tarefa antes de salvar.", NotificationType.Warning),
                                                  Set(varSalvando, true);
                                                  Set(varErroGravacao, Blank());
                                                  ClearCollect(colFalhasTarefas, {TaskID: "", Mensagem: ""});
                                                  Clear(colFalhasTarefas);
                                                  If(IsBlank(varAtividadeID), Set(varAtividadeID, Text(GUID())));
                                                  If(
                                                      IsBlank(varRegistroSalvo),
                                                      IfError(
                                                          Set(
                                                              varRegistroSalvo,
                                                              Patch(
                                                                  tbAtividades,
                                                                  Coalesce(
                                                                      LookUp(tbAtividades, AtividadeID = varAtividadeID),
                                                                      Defaults(tbAtividades)
                                                                  ),
                                                                  {
                                                                      AtividadeID: varAtividadeID,
                                                                      Titulo: Trim(txtTituloReg7V8.Text),
                                                                      Descricao: Trim(txtDescricaoReg7V8.Text),
                                                                      Status: radStatusReg7V8.Selected.Value,
                                                                      Complexidade: ddlComplexidadeReg7V8.Selected.Value,
                                                                      Assigned: If(IsBlank(cmbAssignedReg7V8.Selected.DisplayName), "", cmbAssignedReg7V8.Selected.DisplayName),
                                                                      EstimatedHoras: Sum(colTarefasTemp, Coalesce(EstimatedHoras, 0)),
                                                                      VinculoID: ddV9VinculoRegistro.Selected.ID,
                                                                      DueDate: dtpDueDateReg7V8.SelectedDate,
                                                                      Priority: ddlPriorityReg7V8.Selected.Value,
                                                                      CriadoPor: User().FullName,
                                                                      CriadoEm: Now(),
                                                                      AtualizadoEm: Now()
                                                                  }
                                                              )
                                                          ),
                                                          Set(varErroGravacao, FirstError.Message)
                                                      )
                                                  );
                                                  If(
                                                      IsBlank(varErroGravacao) && !IsBlank(varRegistroSalvo),
                                                      ForAll(
                                                          colTarefasTemp As t,
                                                          IfError(
                                                              Patch(
                                                                  tbTarefas,
                                                                  Coalesce(
                                                                      LookUp(tbTarefas, TaskID = t.TaskID),
                                                                      Defaults(tbTarefas)
                                                                  ),
                                                                  {
                                                                      TaskID: t.TaskID,
                                                                      AtividadeID: varAtividadeID,
                                                                      TituloTarefa: t.Tarefa,
                                                                      Status: t.Status,
                                                                      EstimatedHoras: t.EstimatedHoras,
                                                                      DueDate: t.DueDate,
                                                                      Priority: t.Priority,
                                                                      Assigned: If(IsBlank(cmbAssignedReg7V8.Selected.DisplayName), "", cmbAssignedReg7V8.Selected.DisplayName),
                                                                      CriadoEm: Now(),
                                                                      AtualizadoEm: Now()
                                                                  }
                                                              ),
                                                              Collect(
                                                                  colFalhasTarefas,
                                                                  {TaskID: t.TaskID, Mensagem: FirstError.Message}
                                                              );
                                                              Blank()
                                                          )
                                                      )
                                                  );
                                                  If(
                                                      !IsBlank(varErroGravacao),
                                                      Notify("Erro ao salvar atividade: " & varErroGravacao, NotificationType.Error),
                                                      If(
                                                          CountRows(colFalhasTarefas) > 0,
                                                          Notify(
                                                              "Atividade gravada, mas " & CountRows(colFalhasTarefas) &
                                                              " tarefa(s) falharam. Verifique o Excel e tente Salvar novamente. Não clique em Cancelar.",
                                                              NotificationType.Error
                                                          ),
                                                          Reset(txtTituloReg7V8);
                                                          Reset(txtDescricaoReg7V8);
                                                          Reset(cmbAssignedReg7V8);
                                                          Reset(txtEstimatedReg7V8);
                                                          Reset(dtpDueDateReg7V8);
                                                          Reset(ddlComplexidadeReg7V8);
                                                          Reset(ddlPriorityReg7V8);
                                                          Reset(radStatusReg7V8);
                                                          Reset(txtTarefaTituloReg7V8);
                                                          Reset(ddlTarefaStatusReg7V8);
                                                          Reset(txtTarefaHorasReg7V8);
                                                          Reset(dtpTarefaPrazoReg7V8);
                                                          Reset(ddlTarefaPrioridadeReg7V8);
                                                          Clear(colTarefasTemp);
                                                          Set(varExibirEntradaTarefa, false);
                                                          Refresh(tbAtividades);
                                                          ClearCollect(colRecentesLive, tbAtividades);
                                                          If(
                                                              IsBlank(LookUp(colRecentesLive, AtividadeID = varRegistroSalvo.AtividadeID)),
                                                              Collect(colRecentesLive, varRegistroSalvo)
                                                          );
                                                          Refresh(tbTarefas);
                                                          Set(varErroLog, Blank());
                                                          IfError(
                                                              Patch(
                                                                  tbLogAtividades,
                                                                  Defaults(tbLogAtividades),
                                                                  {
                                                                      LogID: Text(GUID()),
                                                                      AtividadeID: varAtividadeID,
                                                                      RegistroID: varAtividadeID,
                                                                      Entidade: "Atividade",
                                                                      Operacao: "Incluir",
